name: Gerar pacote de publicacao

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-dist.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Baixar imagens reais do Git LFS
        run: git lfs pull
      - name: Validar imagens do site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('public/assets').glob('*'))
          images = [p for p in files if p.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp'}]
          if not images:
              raise SystemExit('Nenhuma imagem encontrada em public/assets')
          pointers = [str(p) for p in images if p.read_bytes()[:50].startswith(b'version https://git-lfs.github.com/spec/v1')]
          if pointers:
              raise SystemExit('Imagens Git LFS nao baixadas: ' + ', '.join(pointers[:10]))
          print(f'{len(images)} imagens reais validadas')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar dist
        run: npm run build
      - name: Compactar dist
        run: |
          cd dist
          zip -r ../cassiano-dist.zip .
      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cassiano-dist
          path: cassiano-dist.zip
          retention-days: 30
      - name: Compactar apenas HTML e JavaScript (sem imagens)
        run: |
          cd dist
          zip ../cassiano-atualizacao-sem-imagens.zip index.html assets/*.js
      - name: Disponibilizar pacote leve sem imagens
        uses: actions/upload-artifact@v4
        with:
          name: cassiano-atualizacao-sem-imagens
          path: cassiano-atualizacao-sem-imagens.zip
          retention-days: 30
